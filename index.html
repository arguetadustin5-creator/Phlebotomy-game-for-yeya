<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Kitty Phlebotomy Study Game 🎀</title>
    <style>
        :root {
            --bg-color: #ffb6c1; /* Soft pink background */
            --card-bg: #fff0f5;
            --primary: #9370db; /* Medium purple */
            --primary-hover: #8a2be2;
            --red: #ff69b4;   /* Hot pink */
            --blue: #ba55d3;  /* Orchid purple */
            --yellow: #dda0dd; /* Plum */
            --green: #da70d6;  /* Fuchsia/Violet */
            --text-color: #4a2e35;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #ffb6c1 0%, #dda0dd 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .game-container {
            width: 100%;
            max-width: 800px;
            background: #ffffff;
            border: 4px solid var(--primary);
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(147, 112, 219, 0.3);
            overflow: hidden;
            padding: 24px;
            text-align: center;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px dashed #ffb6c1;
        }

        .stat-box {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--primary);
            background: #f8f0fc;
            padding: 8px 16px;
            border-radius: 20px;
            border: 2px solid #dda0dd;
        }

        .question-box {
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 24px;
            padding: 15px;
            background: #fff5f8;
            border-radius: 16px;
            border-left: 6px solid var(--red);
            border-right: 2px solid #ffb6c1;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            border: none;
            border-radius: 14px;
            padding: 18px 15px;
            font-size: 1.05rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            text-align: left;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .option-btn:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }

        .option-btn:active {
            transform: translateY(0);
        }

        .btn-0 { background-color: #ff69b4; } /* Hot Pink */
        .btn-1 { background-color: #9370db; } /* Purple */
        .btn-2 { background-color: #ba55d3; } /* Orchid */
        .btn-3 { background-color: #da70d6; } /* Plum */

        .btn-icon {
            margin-right: 12px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .feedback {
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 15px;
            min-height: 35px;
        }

        .feedback.correct { color: #8a2be2; }
        .feedback.incorrect { color: #ff1493; }

        .next-btn, .start-btn {
            background-color: var(--primary);
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 14px 32px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 4px 10px rgba(147, 112, 219, 0.3);
            transition: background-color 0.2s;
        }

        .next-btn:hover, .start-btn:hover {
            background-color: var(--primary-hover);
        }

        .hidden { display: none !important; }

        .progress-bar {
            height: 10px;
            background: #f0e6fa;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid #dda0dd;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff69b4, #9370db);
            width: 0%;
            transition: width 0.3s ease;
        }

        .bow {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="game-container" id="start-screen">
    <div class="bow">🎀</div>
    <h1 style="color: var(--primary); margin-bottom: 10px;">Hello Yeya's Phlebotomy Quiz!</h1>
    <p style="font-size: 1.1rem; color: #666; margin-bottom: 25px;">Master all 55 Phlebotomy exam questions with randomized pink & purple cuteness! Let's get that certification! ✨</p>
    <button class="start-btn" onclick="startGame()">Start Studying! 💖</button>
</div>

<div class="game-container hidden" id="game-screen">
    <div class="header">
        <div class="stat-box" id="question-count">Question 1/55</div>
        <div class="stat-box" id="score-display">Score: 0</div>
    </div>
    
    <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
    </div>

    <div class="question-box" id="question-text">
        Question text will appear here...
    </div>

    <div class="options-grid" id="options-grid">
        <button class="option-btn btn-0" onclick="checkAnswer(0)"><span class="btn-icon">🎀</span> <span id="opt-0">Option 1</span></button>
        <button class="option-btn btn-1" onclick="checkAnswer(1)"><span class="btn-icon">⭐</span> <span id="opt-1">Option 2</span></button>
        <button class="option-btn btn-2" onclick="checkAnswer(2)"><span class="btn-icon">💖</span> <span id="opt-2">Option 3</span></button>
        <button class="option-btn btn-3" onclick="checkAnswer(3)"><span class="btn-icon">🌸</span> <span id="opt-3">Option 4</span></button>
    </div>

    <div class="feedback" id="feedback"></div>
    <button class="next-btn hidden" id="next-btn" onclick="nextQuestion()">Next Question ➔</button>
</div>

<div class="game-container hidden" id="end-screen">
    <div class="bow">🎉🎀</div>
    <h1 style="color: var(--primary); margin-bottom: 15px;">Amazing Job, Yeya!</h1>
    <p style="font-size: 1.3rem; font-weight: bold; margin-bottom: 10px;" id="final-score">Your Score: 0 / 5500</p>
    <p style="font-size: 1.1rem; color: #666; margin-bottom: 25px;" id="final-percent">Accuracy: 0%</p>
    <button class="start-btn" onclick="startGame()">Play Again (Shuffled) 🔄</button>
</div>

<script>
const baseQuestions = [
    { q: "Identify the United States Federal Government amendment that defines the responsibilities of medical laboratory personnel?", choices: ["CLIA - Clinical Laboratory Improvement Amendments", "HIPAA", "OSHA", "CLSI"], correct: 0 },
    { q: "Identify the most common bloodborne diseases diagnosed in healthcare professionals?", choices: ["Hepatitis B, Hepatitis C, HIV", "Tuberculosis, Flu, COVID-19", "Malaria, Zika, Lyme Disease", "E. coli, Salmonella, Staph"], correct: 0 },
    { q: "Identify the most likely means of contracting Hepatitis B in a healthcare setting?", choices: ["Airborne droplets", "An accidental needlestick", "Direct skin-to-skin contact", "Contaminated food"], correct: 1 },
    { q: "Identify the number of red blood cells in one cubic millimeter of human blood?", choices: ["1.0–2.0 mil", "2.5–3.5 mil", "RBC - 4.5–6 mil", "8.0–10.0 mil"], correct: 2 },
    { q: "Identify the percentage of water in blood plasma?", choices: ["50%", "75%", "90%", "99%"], correct: 2 },
    { q: "Platelet aggregation is best described as:", choices: ["Activated platelets stick to each other to form a platelet plug", "Red blood cells bursting", "White blood cells attacking bacteria", "Fibrin dissolving a clot"], correct: 0 },
    { q: "Blood serum is best described as:", choices: ["Liquid portion of blood that remains after a blood sample has clotted", "Liquid portion with anticoagulants preserved", "Cellular component of blood", "Pure red blood cell layer"], correct: 0 },
    { q: "Identify the drugs that are anticoagulant agents (At least 3):", choices: ["Heparin, Warfarin (Coumadin), EDTA / Aspirin", "Tylenol, Advil, Aspirin", "Amoxicillin, Penicillin, Vancomycin", "Insulin, Metformin, Synthroid"], correct: 0 },
    { q: "Complete Blood Count (CBC) tube color:", choices: ["Light Blue", "Lavender", "Red", "Gray"], correct: 1 },
    { q: "Glucose Tolerance Test (GTT) tube color:", choices: ["Lavender", "Gray", "Green", "Pink"], correct: 1 },
    { q: "Prothrombin Time (PT) tube color:", choices: ["Light Blue", "Red", "Lavender", "Royal Blue"], correct: 0 },
    { q: "Heavy Metals tube color:", choices: ["Royal Blue", "Yellow", "Green", "Gray"], correct: 0 },
    { q: "Type and Crossmatch tube color:", choices: ["Pink", "Light Blue", "Gray", "Green"], correct: 0 },
    { q: "Maximum penetration depth for a human infant heel stick procedure:", choices: ["1.0 mm", "2.0 mm", "3.0 mm", "4.0 mm"], correct: 1 },
    { q: "Number of minutes a human blood specimen can sit in a separator tube before centrifugation:", choices: ["10 min", "15–20 min", "30 minimum, 60 maximum", "120 min"], correct: 2 },
    { q: "Primary cause of hemolysis in a human blood collection specimen:", choices: ["Using too small of a needle gauge (or pulling back too fast)", "Inverting the tube 8 times", "Using a tourniquet for 30 seconds", "Warming the site"], correct: 0 },
    { q: "Type of antiseptic used when drawing blood for a Blood Alcohol Level test:", choices: ["70% Isopropyl Alcohol", "Non-alcoholic antiseptic (e.g. Benzalkonium chloride)", "Bleach solution", "Hydrogen peroxide"], correct: 1 },
    { q: "A reticulocyte is best described as a:", choices: ["Mature red blood cell", "An immature red blood cell", "Type of white blood cell", "Platelet fragment"], correct: 1 },
    { q: "Lab test most affected by a human patient not fasting for 9-12 hours:", choices: ["CBC", "Triglycerides / Lipid Panel (or Glucose)", "Blood Type", "Electrolytes"], correct: 1 },
    { q: "Lab test that requires human blood to be collected with chain of custody protocol:", choices: ["Drug screen (or Blood Alcohol Level / Forensic)", "CBC", "BMP", "TSH"], correct: 0 },
    { q: "Blood lab test specimen that needs to be kept warm during transport:", choices: ["Cold agglutinins (or Cryoglobulins)", "Bilirubin", "Ammonia", "Lactic acid"], correct: 0 },
    { q: "Lab test performed in the microbiology department:", choices: ["Blood cultures", "CBC", "Lipid panel", "Glucose"], correct: 0 },
    { q: "Name of the additives in green top blood collection tubes:", choices: ["EDTA", "Sodium Citrate", "Heparin", "Sodium Fluoride"], correct: 2 },
    { q: "Purpose of an antiglycolytic agent in human blood collection tubes:", choices: ["To prevent glycolysis (breakdown of glucose)", "To preserve red cells", "To cause rapid clotting", "To prevent hemolysis"], correct: 0 },
    { q: "Specimen collected as an enzyme in a marble red top blood collection tube:", choices: ["Plasma", "Serum", "Whole blood", "Platelets"], correct: 1 },
    { q: "Name of the additive in the lavender top collection tube:", choices: ["EDTA", "Heparin", "Sodium Citrate", "Silica"], correct: 0 },
    { q: "Lab test requiring a royal blue top tube with EDTA additive:", choices: ["Trace elements, metals, Lead, Arsenic", "Routine Glucose", "Coagulation PT/PTT", "Blood cultures"], correct: 0 },
    { q: "Human blood collection tube that will yield a serum specimen:", choices: ["Red top", "Lavender top", "Light Blue top", "Gray top"], correct: 0 },
    { q: "Name of the additive in the light blue top blood collection tube:", choices: ["EDTA", "Sodium citrate", "Heparin", "Potassium Oxalate"], correct: 1 },
    { q: "Human blood collection tube used for a fasting blood sugar test:", choices: ["Gray top", "Lavender top", "Red top", "Green top"], correct: 0 },
    { q: "Human lab tests that require a purple/Lavender top blood collection tube:", choices: ["CBC, WBC, RBC", "PT / PTT", "Electrolytes", "Bilirubin"], correct: 0 },
    { q: "Human blood component used for an electrolyte panel lab test:", choices: ["Plasma or serum", "Red blood cells only", "Platelets only", "Buffy coat"], correct: 0 },
    { q: "When the aseptic human blood collection technique is used:", choices: ["When drawing blood cultures", "Routine CBC draw", "Infant heel stick", "Glucose check"], correct: 0 },
    { q: "Required information on a labeled human blood specimen tube:", choices: ["Patient full name, DOB, Date & time, Phlebotomist initials", "Patient name only", "Doctor name and room number", "Date of collection only"], correct: 0 },
    { q: "Where blood collection tubes should be labeled by the phlebotomist:", choices: ["At the patient's bedside immediately after draw", "At the lab desk later", "Before entering the patient room", "In the breakroom"], correct: 0 },
    { q: "The ____ the needle gauge, the larger the needle bore:", choices: ["Smaller", "Larger", "Higher", "Longer"], correct: 0 },
    { q: "Medical procedure a phlebotomist is NOT certified to complete:", choices: ["Accessing/drawing from an IV line or arterial line", "Routine venipuncture", "Capillary heel stick", "Dermal finger stick"], correct: 0 },
    { q: "Scenario where butterfly needle procedure should NOT be used:", choices: ["Routine venipuncture on large, healthy veins", "Elderly patients with fragile veins", "Pediatric patients", "Hand vein draws"], correct: 0 },
    { q: "Correct order of blood draw during routine venipuncture:", choices: ["Sterile/Yellow, Light Blue, Red/SST, Green, Lavender, Gray", "Gray, Lavender, Green, Red, Yellow", "Lavender, Light Blue, Red, Gray", "Red, Yellow, Gray, Green, Blue"], correct: 0 },
    { q: "Correct angle for needle insertion during routine venipuncture:", choices: ["5 to 10 degrees", "15 to 30 degrees", "45 to 60 degrees", "90 degrees"], correct: 1 },
    { q: "When trough drug levels are typically drawn:", choices: ["15 minutes immediately prior to next scheduled dose", "30 minutes after drug infusion", "2 hours after meals", "At bedtime"], correct: 0 },
    { q: "Type of specimen collected when using a dermal puncture technique:", choices: ["Capillary blood", "Arterial blood", "Pure venous blood", "Lymphatic fluid"], correct: 0 },
    { q: "Why wrap aluminum foil around a human blood specimen:", choices: ["To protect light-sensitive analytes (e.g., Bilirubin)", "To keep the tube warm", "To prevent clotting", "To speed up spinning"], correct: 0 },
    { q: "Medical condition created by prolonged tourniquet application:", choices: ["Hemoconcentration", "Hematoma", "Hemolysis", "Syncope"], correct: 0 },
    { q: "A winged infusion set is also referred to as a:", choices: ["Butterfly needle", "Lancet", "Syringe driver", "Vacutainer hub"], correct: 0 },
    { q: "Lab test abbreviation that measures thyroid function:", choices: ["TSH (Thyroid Stimulating Hormone)", "PSA", "BMP", "BUN"], correct: 0 },
    { q: "Abbreviation for Thyroid Stimulating Hormone:", choices: ["TSH", "THS", "T3T4", "STH"], correct: 0 },
    { q: "Abbreviation for Prostate Specific Antigen:", choices: ["PSA", "PAS", "PRO", "SAG"], correct: 0 },
    { q: "Abbreviation for Activated Clotting Time:", choices: ["ACT", "ATC", "CAT", "CLT"], correct: 0 },
    { q: "Abbreviation for Basic Metabolic Panel:", choices: ["BMP", "BPM", "PBM", "MAP"], correct: 0 },
    { q: "Abbreviation for Blood Urea Nitrogen:", choices: ["BUN", "BNU", "RUB", "BUR"], correct: 0 },
    { q: "Abbreviation for Glucose Tolerance Test:", choices: ["GTT", "GTG", "TGT", "GLU"], correct: 0 },
    { q: "Abbreviation for Antigen:", choices: ["Ag", "An", "At", "Agp"], correct: 0 },
    { q: "Microcollection tube filled FIRST during skin puncture:", choices: ["EDTA (Lavender top)", "Red top", "Green top", "Gray top"], correct: 0 },
    { q: "Most common venipuncture complication:", choices: ["Hematoma", "Vein collapse", "Nerve damage", "Infection"], correct: 0 }
];

let questions = [];
let currentIndex = 0;
let score = 0;
let answered = false;

function shuffleArray(array) {
    let shuffled = JSON.parse(JSON.stringify(array));
    for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled;
}

function startGame() {
    questions = shuffleArray(baseQuestions);
    currentIndex = 0;
    score = 0;
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('end-screen').classList.add('hidden');
    document.getElementById('game-screen').classList.remove('hidden');
    loadQuestion();
}

function loadQuestion() {
    answered = false;
    document.getElementById('feedback').innerText = '';
    document.getElementById('next-btn').classList.add('hidden');
    
    const currentQ = questions[currentIndex];
    document.getElementById('question-count').innerText = `Question ${currentIndex + 1}/${questions.length}`;
    document.getElementById('score-display').innerText = `Score: ${score}`;
    document.getElementById('question-text').innerText = currentQ.q;
    
    const pct = ((currentIndex) / questions.length) * 100;
    document.getElementById('progress-fill').style.width = `${pct}%`;

    const btns = document.querySelectorAll('.option-btn');
    btns.forEach((btn, idx) => {
        btn.disabled = false;
        btn.style.opacity = '1';
        document.getElementById(`opt-${idx}`).innerText = currentQ.choices[idx];
    });
}

function checkAnswer(selectedIdx) {
    if (answered) return;
    answered = true;

    const currentQ = questions[currentIndex];
    const btns = document.querySelectorAll('.option-btn');
    
    btns.forEach(btn => btn.disabled = true);

    if (selectedIdx === currentQ.correct) {
        score += 100;
        document.getElementById('score-display').innerText = `Score: ${score}`;
        document.getElementById('feedback').innerText = "💖 Correct! +100 Points ✨";
        document.getElementById('feedback').className = "feedback correct";
    } else {
        document.getElementById('feedback').innerText = `❌ Incorrect! Correct answer: ${currentQ.choices[currentQ.correct]}`;
        document.getElementById('feedback').className = "feedback incorrect";
        btns[selectedIdx].style.opacity = '0.4';
    }

    document.getElementById('next-btn').classList.remove('hidden');
}

function nextQuestion() {
    currentIndex++;
    if (currentIndex < questions.length) {
        loadQuestion();
    } else {
        showEndScreen();
    }
}

function showEndScreen() {
    document.getElementById('game-screen').classList.add('hidden');
    document.getElementById('end-screen').classList.remove('hidden');
    
    const totalPossible = questions.length * 100;
    const accuracy = Math.round((score / totalPossible) * 100);
    
    document.getElementById('final-score').innerText = `Your Score: ${score} / ${totalPossible}`;
    document.getElementById('final-percent').innerText = `Accuracy: ${accuracy}%`;
}
</script>

</body>
</html>
