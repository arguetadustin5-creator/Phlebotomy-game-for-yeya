<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Kitty Phlebotomy Order of Draw Quiz 🎀</title>
    <style>
        :root {
            --bg-color: #ffb6c1;
            --card-bg: #fff0f5;
            --primary: #9370db;
            --primary-hover: #8a2be2;
            --red: #ff69b4;
            --blue: #ba55d3;
            --yellow: #dda0dd;
            --green: #da70d6;
            --text-color: #4a2e35;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #ffb6c1 0%, #dda0dd 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .main-wrapper {
            display: flex;
            flex-direction: row;
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }

        @media (max-width: 800px) {
            .main-wrapper {
                flex-direction: column;
            }
        }

        .leaderboard-card {
            width: 280px;
            background: #ffffff;
            border: 4px solid var(--primary);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(147, 112, 219, 0.3);
            text-align: center;
            flex-shrink: 0;
        }

        @media (max-width: 800px) {
            .leaderboard-card {
                width: 100%;
            }
        }

        .leaderboard-title {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 15px;
            border-bottom: 2px dashed #ffb6c1;
            padding-bottom: 8px;
        }

        .leaderboard-list {
            list-style: none;
            text-align: left;
            max-height: 350px;
            overflow-y: auto;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            background: #fff5f8;
            padding: 10px 12px;
            border-radius: 12px;
            margin-bottom: 8px;
            border: 1px solid #dda0dd;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .leaderboard-item span.rank {
            color: var(--primary);
            font-weight: bold;
            margin-right: 6px;
        }

        .game-container {
            flex-grow: 1;
            background: #ffffff;
            border: 4px solid var(--primary);
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(147, 112, 219, 0.3);
            overflow: hidden;
            padding: 24px;
            text-align: center;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px dashed #ffb6c1;
        }

        .stat-box {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--primary);
            background: #f8f0fc;
            padding: 8px 16px;
            border-radius: 20px;
            border: 2px solid #dda0dd;
        }

        .question-box {
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 24px;
            padding: 15px;
            background: #fff5f8;
            border-radius: 16px;
            border-left: 6px solid var(--red);
            border-right: 2px solid #ffb6c1;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            border: none;
            border-radius: 14px;
            padding: 18px 15px;
            font-size: 1.05rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            text-align: left;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .option-btn:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }

        .btn-0 { background-color: #ff69b4; }
        .btn-1 { background-color: #9370db; }
        .btn-2 { background-color: #ba55d3; }
        .btn-3 { background-color: #da70d6; }

        .btn-icon { margin-right: 12px; font-size: 1.2rem; }

        .feedback {
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 15px;
            min-height: 35px;
        }

        .feedback.correct { color: #8a2be2; }
        .feedback.incorrect { color: #ff1493; }

        .next-btn, .start-btn {
            background-color: var(--primary);
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 14px 32px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 4px 10px rgba(147, 112, 219, 0.3);
        }

        .name-input {
            padding: 12px;
            font-size: 1.1rem;
            border-radius: 14px;
            border: 2px solid #dda0dd;
            margin-bottom: 15px;
            width: 80%;
            text-align: center;
        }

        .celebration-img {
            max-width: 180px;
            width: 100%;
            height: auto;
            border-radius: 16px;
            margin-bottom: 15px;
        }

        .hidden { display: none !important; }

        .progress-bar {
            height: 10px;
            background: #f0e6fa;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid #dda0dd;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff69b4, #9370db);
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>

<div class="main-wrapper">

    <!-- Global Leaderboard Side Card -->
    <div class="leaderboard-card">
        <div class="leaderboard-title">🏆 Global Leaderboard</div>
        <ul class="leaderboard-list" id="leaderboard-list">
            <li class="leaderboard-item">Loading scores...</li>
        </ul>
    </div>

    <!-- Main Game Section -->
    <div class="game-container" id="start-screen">
        <div style="font-size: 2.5rem; margin-bottom: 10px;">🎀🩸</div>
        <h1 style="color: var(--primary); margin-bottom: 10px;">Order of Draw Study Game!</h1>
        <p style="font-size: 1rem; color: #666; margin-bottom: 20px;">Master tube colors, additives, departments, and tests based on your exact class notes!</p>
        
        <input type="text" id="player-name" class="name-input" placeholder="Enter your name (e.g. Yeya)" value="Yeya">
        <br>
        <button class="start-btn" onclick="startGame()">Start Studying! 💖</button>
    </div>

    <div class="game-container hidden" id="game-screen">
        <div class="header">
            <div class="stat-box" id="question-count">Question 1/30</div>
            <div class="stat-box" id="score-display">Score: 0</div>
        </div>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>

        <div class="question-box" id="question-text">
            Question text...
        </div>

        <div class="options-grid" id="options-grid">
            <button class="option-btn btn-0" onclick="checkAnswer(0)"><span class="btn-icon">🎀</span> <span id="opt-0"></span></button>
            <button class="option-btn btn-1" onclick="checkAnswer(1)"><span class="btn-icon">⭐</span> <span id="opt-1"></span></button>
            <button class="option-btn btn-2" onclick="checkAnswer(2)"><span class="btn-icon">💖</span> <span id="opt-2"></span></button>
            <button class="option-btn btn-3" onclick="checkAnswer(3)"><span class="btn-icon">🌸</span> <span id="opt-3"></span></button>
        </div>

        <div class="feedback" id="feedback"></div>
        <button class="next-btn hidden" id="next-btn" onclick="nextQuestion()">Next Question ➔</button>
    </div>

    <div class="game-container hidden" id="end-screen">
        <img src="https://upload.wikimedia.org/wikipedia/en/a/a6/Hello_Kitty_logo.svg" alt="Celebration" class="celebration-img">
        <h1 style="color: var(--primary); margin-bottom: 15px;">Study Complete! 🎉</h1>
        <p style="font-size: 1.3rem; font-weight: bold; margin-bottom: 10px;" id="final-score">Your Score: 0 / 3000</p>
        <p style="font-size: 1.1rem; color: #666; margin-bottom: 20px;" id="final-percent">Accuracy: 0%</p>
        <p style="font-size: 1rem; color: var(--primary); font-weight: bold; margin-bottom: 15px;" id="saving-status"></p>
        <button class="start-btn" onclick="startGame()">Play Again (Shuffled) 🔄</button>
    </div>

</div>

<script>
const BIN_ID = "6ad7d65effd5d160537d4ace";
const MASTER_KEY = "$2a$10$bW9hX2WRYBaHj/SXAVNxHuamBD8LpfvWCDo6aCKQJoBy7IG8d/LqW";

const baseQuestions = [
    { q: "Which mnemonic phrase is used to remember the Order of Draw in your notes?", choices: ["Silly / Young Little Boys Rarely Get Lovely Girls", "Some Young Ladies Read Good Books Daily", "Save Yellow Light Blue Reds Green Lavender Gray", "Send Your Lab Blood Right Guarded Always"], correct: 0 },
    { q: "What is drawn FIRST in the Order of Draw?", choices: ["Sterile / Yellow (Aerobic, then Anaerobic)", "Light Blue", "Red Glass", "Lavender"], correct: 0 },
    { q: "When drawing Sterile blood cultures, which bottle must be drawn FIRST?", choices: ["Aerobic first, then Anaerobic", "Anaerobic first, then Aerobic", "It does not matter", "Both drawn simultaneously"], correct: 0 },
    { q: "What additives are inside the Sterile / Yellow blood culture tubes?", choices: ["SPS + Agar (or SPS)", "Sodium Citrate", "Lithium Heparin", "EDTA"], correct: 0 },
    { q: "Which department receives Sterile / Yellow tubes for Blood Culture & Sensitivity (C+S) tests?", choices: ["Microbiology / Pathology", "Coagulation", "Chemistry", "Hematology"], correct: 0 },
    { q: "What additive is in the Light Blue tube?", choices: ["Sodium Citrate", "EDTA", "Sodium Heparin", "SPS + Agar"], correct: 0 },
    { q: "How many times should a Light Blue tube be inverted?", choices: ["3–4 times", "8–10 times", "15 times", "Do not invert"], correct: 0 },
    { q: "Which department receives Light Blue tubes for tests like PT, PTT, INR, and D-dimer?", choices: ["Coagulation and Hematology", "Microbiology", "Chemistry", "Blood Bank"], correct: 0 },
    { q: "What type of specimen is tested from a Light Blue tube?", choices: ["Plasma", "Serum", "Whole Blood", "Sputum"], correct: 0 },
    { q: "In the Order of Draw, which tubes come directly after Light Blue?", choices: ["Reds (Red glass, Red plastic, SST / Gold / Marble)", "Light Green", "Lavender", "Gray"], correct: 0 },
    { q: "What additive is inside a Red Glass tube?", choices: ["None", "Clot Activator", "Sodium Citrate", "EDTA"], correct: 0 },
    { q: "What additives/separators are inside Red Plastic and SST (Marble/Gold) tubes?", choices: ["Clot Activator & Sep Gel", "Heparin & EDTA", "Sodium Citrate & Agar", "Potassium Oxalate"], correct: 0 },
    { q: "Which department processes Red Glass, Red Plastic, and SST tubes?", choices: ["Chemistry", "Microbiology", "Coagulation", "Hematology"], correct: 0 },
    { q: "What specimen type is tested from Red tubes (Red Glass, Red Plastic, SST)?", choices: ["Serum", "Plasma", "Whole Blood", "Platelet-rich Plasma"], correct: 0 },
    { q: "Which tests are performed using Red tubes?", choices: ["Therapeutic Drug Monitoring, Cholesterol, Electrolytes, Blood Glucose", "CBC, H+H, RBC, WBC", "PT, PTT, INR, FDP", "Blood Culture & Sensitivity"], correct: 0 },
    { q: "According to your notes, what rule applies to testing in Green tubes versus Red tubes?", choices: ["Anything that can be tested in REDS can be tested in GREENS", "REDS testing can never be done in GREENS", "GREENS can only test Whole Blood", "REDS and GREENS have identical additives"], correct: 0 },
    { q: "What additive is in a Light Green tube?", choices: ["Lithium Heparin + Sep Gel (PST)", "Sodium Heparin", "EDTA", "Sodium Citrate"], correct: 0 },
    { q: "How many inversions are required for Light Green tubes?", choices: ["8–10 times", "1–2 times", "3–4 times", "No inversions"], correct: 0 },
    { q: "Which department processes Light Green and Dark Green tubes?", choices: ["Chemistry", "Hematology", "Microbiology", "Coagulation"], correct: 0 },
    { q: "What specimen type is tested from Light Green tubes?", choices: ["Plasma (PST)", "Serum", "Whole Blood", "Buffy Coat"], correct: 0 },
    { q: "What additive is in a Dark Green tube?", choices: ["Sodium Heparin (or Lithium Heparin)", "EDTA", "Sodium Citrate", "Sodium Fluoride"], correct: 0 },
    { q: "Dark Green tubes with Sodium Heparin are used for sodium testing, while Lithium Heparin is used for:", choices: ["Lithium testing", "Glucose testing", "Coagulation testing", "DNA testing"], correct: 0 },
    { q: "What additive is inside the Lavender tube?", choices: ["EDTA (or K2 EDTA)", "Sodium Citrate", "Heparin", "Sodium Fluoride"], correct: 0 },
    { q: "How many inversions are required for a Lavender tube?", choices: ["8–10 times", "3–4 times", "1–2 times", "12–15 times"], correct: 0 },
    { q: "Which department receives Lavender tubes?", choices: ["Hematology", "Chemistry", "Microbiology", "Coagulation"], correct: 0 },
    { q: "What specimen type is tested from a Lavender tube?", choices: ["Whole Blood", "Serum", "Plasma", "Clotted Blood"], correct: 0 },
    { q: "Which common tests are drawn in a Lavender tube?", choices: ["CBC, H+H (Hemoglobin + Hematocrit), RBC, WBC", "PT, PTT, INR, D-dimer", "Cholesterol, Electrolytes, Therapeutic Drug Monitoring", "BAC, GTT"], correct: 0 },
    { q: "What additives are in the Gray tube?", choices: ["(Na) Sodium Fluoride + (K) Potassium Oxalate", "Lithium Heparin + Sep Gel", "SPS + Agar", "EDTA + Silica"], correct: 0 },
    { q: "What function does Sodium Fluoride serve in a Gray tube according to your notes?", choices: ["Stops glycolysis -> Prevents bacterial growth", "Prevents blood clotting", "Separates serum from cells", "Activates rapid clotting"], correct: 0 },
    { q: "Which department receives Gray tubes for GTT (Glucose Tolerance Test) and BAC (Blood Alcohol Concentration)?", choices: ["Chemistry", "Hematology", "Coagulation", "Microbiology"], correct: 0 }
];

let questions = [];
let currentIndex = 0;
let score = 0;
let playerName = "";
let answered = false;

function shuffleArray(array) {
    let shuffled = JSON.parse(JSON.stringify(array));
    for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled;
}

async function fetchLeaderboard() {
    try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
            headers: { "X-Master-Key": MASTER_KEY }
        });
        const data = await res.json();
        const list = data.record.leaderboard || [];
        renderLeaderboard(list);
        return list;
    } catch (e) {
        document.getElementById('leaderboard-list').innerHTML = '<li class="leaderboard-item">Error loading scores</li>';
        return [];
    }
}

function renderLeaderboard(list) {
    list.sort((a, b) => b.score - a.score);
    const ul = document.getElementById('leaderboard-list');
    ul.innerHTML = '';

    if (list.length === 0) {
        ul.innerHTML = '<li class="leaderboard-item">No scores yet!</li>';
        return;
    }

    list.slice(0, 10).forEach((item, index) => {
        const li = document.createElement('li');
        li.className = 'leaderboard-item';
        li.innerHTML = `<span><span class="rank">#${index + 1}</span> ${item.name}</span><span>${item.score} pts</span>`;
        ul.appendChild(li);
    });
}

async function saveScoreToLeaderboard(name, newScore) {
    document.getElementById('saving-status').innerText = "Saving score to global leaderboard...";
    let currentList = await fetchLeaderboard();
    currentList.push({ name: name, score: newScore, date: new Date().toLocaleDateString() });

    try {
        await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
            method: 'PUT',
            headers: {
                "Content-Type": "application/json",
                "X-Master-Key": MASTER_KEY
            },
            body: JSON.stringify({ leaderboard: currentList })
        });
        document.getElementById('saving-status').innerText = "✨ Score updated on Live Leaderboard!";
        renderLeaderboard(currentList);
    } catch (e) {
        document.getElementById('saving-status').innerText = "Error saving score.";
    }
}

function startGame() {
    playerName = document.getElementById('player-name').value.trim() || "Anonymous";
    questions = shuffleArray(baseQuestions);
    currentIndex = 0;
    score = 0;
    
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('end-screen').classList.add('hidden');
    document.getElementById('game-screen').classList.remove('hidden');
    loadQuestion();
}

function loadQuestion() {
    answered = false;
    document.getElementById('feedback').innerText = '';
    document.getElementById('next-btn').classList.add('hidden');
    
    const currentQ = questions[currentIndex];
    document.getElementById('question-count').innerText = `Question ${currentIndex + 1}/${questions.length}`;
    document.getElementById('score-display').innerText = `Score: ${score}`;
    document.getElementById('question-text').innerText = currentQ.q;
    
    const pct = ((currentIndex) / questions.length) * 100;
    document.getElementById('progress-fill').style.width = `${pct}%`;

    const btns = document.querySelectorAll('.option-btn');
    btns.forEach((btn, idx) => {
        btn.disabled = false;
        btn.style.opacity = '1';
        document.getElementById(`opt-${idx}`).innerText = currentQ.choices[idx];
    });
}

function checkAnswer(selectedIdx) {
    if (answered) return;
    answered = true;

    const currentQ = questions[currentIndex];
    const btns = document.querySelectorAll('.option-btn');
    btns.forEach(btn => btn.disabled = true);

    if (selectedIdx === currentQ.correct) {
        score += 100;
        document.getElementById('score-display').innerText = `Score: ${score}`;
        document.getElementById('feedback').innerText = "💖 Correct! +100 Points ✨";
        document.getElementById('feedback').className = "feedback correct";
    } else {
        document.getElementById('feedback').innerText = `❌ Wrong! Correct answer: ${currentQ.choices[currentQ.correct]}`;
        document.getElementById('feedback').className = "feedback incorrect";
        btns[selectedIdx].style.opacity = '0.4';
    }

    document.getElementById('next-btn').classList.remove('hidden');
}

function nextQuestion() {
    currentIndex++;
    if (currentIndex < questions.length) {
        loadQuestion();
    } else {
        showEndScreen();
    }
}

function showEndScreen() {
    document.getElementById('game-screen').classList.add('hidden');
    document.getElementById('end-screen').classList.remove('hidden');
    
    const totalPossible = questions.length * 100;
    const accuracy = Math.round((score / totalPossible) * 100);
    
    document.getElementById('final-score').innerText = `Your Score: ${score} / ${totalPossible}`;
    document.getElementById('final-percent').innerText = `Accuracy: ${accuracy}%`;

    saveScoreToLeaderboard(playerName, score);
}

// Initial fetch on page load
fetchLeaderboard();
</script>

</body>
</html>
